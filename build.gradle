plugins {
    id 'base'
    id 'com.android.library' version '8.11.1' apply false
    id 'com.android.application' version '8.11.1' apply false
}

allprojects {
    group = 'com.nikitos'
    version = '3.4.0'
}

tasks.register('releaseJars') {
    group = 'build'
    description = 'Builds the core, Android and desktop runtime JARs.'
    dependsOn ':core:jar', ':android:androidReleaseJar', ':desktop:jar'
}
