plugins {
    id 'java'
}

// ============================================================
// Versions
// ============================================================

ext {
    lwjglVersion = "3.3.3"
    skijaVersion = "0.143.10"
}


// ============================================================
// Portable desktop runtime matrix
// ============================================================

def lwjglNativeClassifiers = [
        'natives-windows',
        'natives-linux',
        'natives-linux-arm64',
        'natives-macos',
        'natives-macos-arm64'
]
def skijaPlatforms = [
        'windows-x64',
        'linux-x64',
        'linux-arm64',
        'macos-x64',
        'macos-arm64'
]

// ============================================================
// Java
// ============================================================

java {
    withSourcesJar()
    withJavadocJar()
}



// ============================================================
// Dependencies
// ============================================================

dependencies {

    // --------------------------------------------------------
    // Project dependencies
    // --------------------------------------------------------

    implementation project(":core")


    // --------------------------------------------------------
    // Logging
    // --------------------------------------------------------

    implementation 'org.slf4j:slf4j-nop:2.0.17'


    // --------------------------------------------------------
    // Audio
    // --------------------------------------------------------

    // BasicPlayer
    implementation 'com.googlecode.soundlibs:basicplayer:3.0.0.0'

    // JLayer MP3 decoder
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'

    // JavaSound MP3 support
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.3'


    // --------------------------------------------------------
    // Math
    // --------------------------------------------------------

    implementation 'org.joml:joml:1.10.8'


    // ========================================================
    // LWJGL
    // ========================================================

    // BOM задаёт одну версию для всех LWJGL-модулей
    implementation platform(
            "org.lwjgl:lwjgl-bom:${lwjglVersion}"
    )


    // Java bindings
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"

    lwjglNativeClassifiers.each { classifier ->
        runtimeOnly "org.lwjgl:lwjgl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-glfw::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${classifier}"
    }


    // ========================================================
    // Skija
    // ========================================================

    implementation "io.github.humbleui:skija-shared:${skijaVersion}"

    skijaPlatforms.each { platformName ->
        implementation "io.github.humbleui:skija-${platformName}:${skijaVersion}"
    }


    // ========================================================
    // Tests
    // ========================================================

    testImplementation platform(
            'org.junit:junit-bom:5.10.0'
    )

    testImplementation 'org.junit.jupiter:junit-jupiter'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}



// ============================================================
// Tests
// ============================================================

test {
    useJUnitPlatform()
}

tasks.register('mouseCallbacksSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the real OpenGL smoke scene; use -PcaptureDir=<directory> for one capture and exit.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'MouseCallbacksSmokeTestMain'
    if (providers.gradleProperty('captureDir').isPresent()) {
        args '--capture', providers.gradleProperty('captureDir').get()
    }
}
