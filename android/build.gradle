plugins {
    id 'com.android.library'
}

android {

    namespace 'com.nikitos.android'
    compileSdk 36

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    aaptOptions {
        noCompress "mp3"
        noCompress "wav"
        noCompress "ogg"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

   // implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation(project(":core"))
    //implementation libs.media3.common
    //implementation libs.media3.exoplayer
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}

tasks.register('androidReleaseJar') {
    group = 'build'
    description = 'Extracts the compiled release classes JAR and keeps a versioned AAR.'
    dependsOn 'bundleReleaseAar'

    def aarFile = layout.buildDirectory.file('outputs/aar/android-release.aar')
    def jarFile = layout.buildDirectory.file("libs/android-${project.version}.jar")
    def versionedAarFile = layout.buildDirectory.file("libs/android-${project.version}.aar")
    inputs.file(aarFile)
    outputs.files(jarFile, versionedAarFile)

    doLast {
        def classesJar = zipTree(aarFile.get().asFile).matching { include 'classes.jar' }.singleFile
        copy {
            from classesJar
            into jarFile.get().asFile.parentFile
            rename { jarFile.get().asFile.name }
        }
        copy {
            from aarFile
            into versionedAarFile.get().asFile.parentFile
            rename { versionedAarFile.get().asFile.name }
        }
    }
}
